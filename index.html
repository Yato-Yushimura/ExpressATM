<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpressBank ATM POV Simulator</title>
    <meta name="description" content="First-person POV ATM simulator featuring an interactive walking cutscene, personalized card generator with unique card number and PIN, interactive wallet, and the full ExpressBank ATM banking software." />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ExpressATM" />
    <meta property="og:title" content="ExpressBank ATM POV Simulator" />
    <meta property="og:description" content="First-person POV ATM simulator featuring an interactive walking cutscene, personalized card generator with unique card number and PIN, interactive wallet, and the full ExpressBank ATM banking software." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__loadGhPagesFallback = function () {
        if (window.__EXPRESSBANK_MOUNTED__ || window.__GH_FALLBACK_LOADING__) return;
        window.__GH_FALLBACK_LOADING__ = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './dist-ghpages/assets/app.css';
        document.head.appendChild(link);

        var script = document.createElement('script');
        script.type = 'module';
        script.src = './dist-ghpages/assets/app.js';
        document.body.appendChild(script);
      };
    </script>
    <script type="module" src="/src/main.jsx" onerror="window.__loadGhPagesFallback()"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__EXPRESSBANK_MOUNTED__) {
            window.__loadGhPagesFallback();
          }
        }, 400);
      });
    </script>
  </body>
</html>
