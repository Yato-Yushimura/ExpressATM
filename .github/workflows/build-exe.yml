name: Build Windows Desktop EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Windows .EXE Native App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate App Icons (ICO & PNG)
        run: python generate_pwa_icons.py

      - name: Install PyInstaller and pywebview
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build Standalone ExpressBank-ATM-Simulator.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "ExpressBank-ATM-Simulator" --icon "public/favicon.ico" --add-data "dist-ghpages;dist-ghpages" desktop_app.py

      - name: Upload Windows .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpressBank-ATM-Simulator-Windows-EXE
          path: dist/ExpressBank-ATM-Simulator.exe
          if-no-files-found: error
          retention-days: 90
