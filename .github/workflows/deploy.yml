name: Deploy to GitHub Pages & Build EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site artifact
        run: |
          python3 generate_pwa_icons.py
          if [ -d "./dist-ghpages" ] && [ -f "./dist-ghpages/index.html" ]; then
            echo "Using pre-built production bundle from ./dist-ghpages"
            cp -r ./dist-ghpages ./dist
            cp public/manifest.json public/manifest.webmanifest public/sw.js public/icon.svg public/favicon.ico public/apple-touch-icon.png public/pwa-192x192.png public/pwa-512x512.png public/pwa-maskable-512x512.png public/pwa-screenshot-wide.png public/pwa-screenshot-narrow.png ./dist/
          else
            npm install --no-audit --no-fund --legacy-peer-deps
            npm run build
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows-exe:
    name: Build Windows .EXE Artifact
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate App Icons
        run: python generate_pwa_icons.py

      - name: Install PyInstaller and pywebview
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Package ExpressBank-ATM-Simulator.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "ExpressBank-ATM-Simulator" --icon "public/favicon.ico" --add-data "dist-ghpages;dist-ghpages" desktop_app.py

      - name: Upload Windows .EXE to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExpressBank-ATM-Simulator-Windows-EXE
          path: dist/ExpressBank-ATM-Simulator.exe
          if-no-files-found: error
          retention-days: 90
